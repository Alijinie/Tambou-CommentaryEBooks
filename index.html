<p>Lord, pour out a spirit of grace and genuine repentance as I look to Christ, whom my sin pierced.</p>`},{title:"Zechariah - Chapter 13",html:`<p class="verse-ref">Zechariah 13:1</p>
<p>Zechariah declared that on that day a fountain would be opened for the house of David and the people of Jerusalem, to cleanse them from sin and impurity.</p>
<h3 class="section-label life">Life Application</h3>
<p>This prophecy points toward the cleansing fountain of Christ's own sacrifice, available for genuine forgiveness.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Father, thank You for the fountain of cleansing opened for me through Christ.</p>
<p class="verse-ref">Zechariah 13:9</p>
<p>The LORD declared He would refine His people like silver and test them like gold, and they would call on His name, and He would answer them.</p>
<h3 class="section-label life">Life Application</h3>
<p>God's refining process, though genuinely difficult, produces a purified relationship marked by calling and answering.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Lord, refine me like silver, and let our relationship be marked by calling on You and receiving Your answer.</p>`},{title:"Zechariah - Chapter 14",html:`<p class="verse-ref">Zechariah 14:4</p>
<p>Zechariah declared that on that day the LORD's feet would stand on the Mount of Olives, east of Jerusalem.</p>
<h3 class="section-label life">Life Application</h3>
<p>This vivid prophecy anticipates God's decisive, visible intervention on behalf of His people at history's climax.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Father, I trust Your decisive, visible intervention at history's ultimate climax.</p>
<p class="verse-ref">Zechariah 14:9</p>
<p>Zechariah declared that the LORD would be king over the whole earth, and on that day there would be one LORD, and His name the only name.</p>
<h3 class="section-label life">Life Application</h3>
<p>God's ultimate purpose culminates in His universal, unrivaled reign over the whole earth.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Lord, let my life anticipate and align with Your coming universal, unrivaled reign.</p>
<p>PART TWELVE</p>
<h3 class="section-label">Book Summary</h3>
<p>Malachi delivers the Old Testament's final prophetic word, confronting a discouraged post-exilic community that had grown spiritually apathetic, offering God half-hearted worship and blemished sacrifices while questioning His justice and love. Structured as a series of rhetorical disputes, the book repeatedly presents God's accusation, the people's skeptical objection, and God's decisive response, addressing corrupt priests, unfaithful marriages, withheld tithes, and cynical doubt about whether serving God was even worthwhile. Malachi closes the Old Testament canon with a remarkable double promise: a coming messenger who would prepare the way before the LORD, and the return of Elijah before the great and dreadful Day of the LORD, promises that find their fulfillment in John the Baptist and Christ's own arrival four hundred years later. The book's closing appeal to remember the Law of Moses while awaiting Elijah's coming creates a fitting bridge between the Old and New Testaments.</p>
<h3 class="section-label">Key Life Applications</h3>
<p class="key-point">1. Give God Your Best, Not Your Leftovers -- Malachi condemns offering blemished sacrifices while withholding genuine devotion. Application: Offer God your genuine best in worship and service, not merely convenient leftovers.</p>
<p class="key-point">2. Faithfulness in Marriage Matters to God -- Malachi confronts the treacherous breaking of marriage covenants. Application: Value and protect the faithfulness of marriage covenants as something God genuinely cares about.</p>
<p class="key-point">3. Test God's Faithfulness Through Generous Giving -- Malachi's famous challenge to bring the whole tithe invites genuine trust in God's provision. Application: Trust God's provision through genuine, generous giving rather than withholding out of fear.</p>
<p class="key-point">4. God Remembers Those Who Fear Him -- Malachi describes a scroll of remembrance for those who feared the LORD and honoured His name. Application: Trust that God genuinely notices and remembers your faithfulness, even when it seems unnoticed by others.</p>`},{title:"Malachi - Chapter 1",html:`<p class="verse-ref">Malachi 1:2</p>
<p>The LORD declared He had loved His people, but they asked how He had loved them.</p>
<h3 class="section-label life">Life Application</h3>
<p>Spiritual apathy can grow so deep that it questions even God's clearly demonstrated love.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Lord, keep my heart from growing so apathetic that I question Your clear, demonstrated love.</p>
<p class="verse-ref">Malachi 1:8</p>
<p>The LORD asked whether offering blind or lame animals for sacrifice was not wrong, challenging them to try presenting such gifts to their governor.</p>
<h3 class="section-label life">Life Application</h3>
<p>Offering God our leftover, inferior effort reflects a genuine lack of reverence for who He is.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Father, help me offer You my genuine best, not merely convenient leftovers.</p>`},{title:"Malachi - Chapter 2",html:`<p class="verse-ref">Malachi 2:14-15</p>
<p>The LORD declared He was a witness between a man and the wife of his youth, to whom he had broken faith, though she was his partner and wife by covenant, so he should guard himself and not be unfaithful.</p>
<h3 class="section-label life">Life Application</h3>
<p>God genuinely witnesses and cares about the faithfulness of marriage covenants between husband and wife.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Lord, help me guard the faithfulness of my covenant relationships, knowing You genuinely witness them.</p>`},{title:"Malachi - Chapter 3",html:`<p class="verse-ref">Malachi 3:1</p>
<p>The LORD declared He would send His messenger, who would prepare the way before Him, and the Lord they were seeking would suddenly come to His temple.</p>
<h3 class="section-label life">Life Application</h3>
<p>This prophecy of a preparing messenger points toward John the Baptist's role preceding Christ's arrival.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Father, thank You for preparing the way for Christ's arrival through Your promised messenger.</p>
<p class="verse-ref">Malachi 3:6</p>
<p>The LORD declared He does not change, and therefore His people were not consumed.</p>
<h3 class="section-label life">Life Application</h3>
<p>God's unchanging character provides the genuine foundation for His people's ongoing preservation and hope.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Lord, thank You for Your unchanging character, the foundation of my ongoing hope.</p>
<p class="verse-ref">Malachi 3:10</p>
<p>The LORD challenged His people to bring the whole tithe into the storehouse, testing Him to see if He would not throw open the floodgates of heaven and pour out blessing.</p>
<h3 class="section-label life">Life Application</h3>
<p>God genuinely invites His people to test His faithfulness through obedient, generous giving.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Father, I trust You with generous giving, testing Your promised faithfulness in return.</p>
<p class="verse-ref">Malachi 3:16</p>
<p>Malachi declared that those who feared the LORD talked with each other, and He listened and heard, and a scroll of remembrance was written for those who feared Him and honoured His name.</p>
<h3 class="section-label life">Life Application</h3>
<p>God genuinely notices, listens to, and remembers those who fear Him, even amid a discouraging surrounding culture.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Lord, thank You for noticing and remembering those who genuinely fear and honour You.</p>`},{title:"Malachi - Chapter 4",html:`<p class="verse-ref">Malachi 4:2</p>
<p>The LORD declared that for those who revere His name, the sun of righteousness would rise with healing in its wings.</p>
<h3 class="section-label life">Life Application</h3>
<p>This prophecy anticipates the healing, restorative arrival of Christ for those who genuinely revere God's name.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Father, thank You for the healing that rises for those who revere Your name.</p>
<p class="verse-ref">Malachi 4:5-6</p>
<p>The LORD declared He would send the prophet Elijah before the coming of the great and dreadful Day of the LORD, turning the hearts of parents to their children and children to their parents.</p>
<h3 class="section-label life">Life Application</h3>
<p>This closing prophecy anticipates reconciliation and preparation of hearts before God's ultimate, decisive day.</p>
<h3 class="section-label prayer">Prayer</h3>
<p>Lord, prepare and reconcile hearts, including my own, before Your ultimate, decisive day.</p>`}];var Vp=Ke(Nn(),1),bm=Symbol.for("react.element");var zm=Object.prototype.hasOwnProperty,Mm=Vp.__SECRET_INTERNALS_DO_NOT_USE_OR_YOU_WILL_BE_FIRED.ReactCurrentOwner,Fm={key:!0,ref:!0,__self:!0,__source:!0};function $p(e,n,t){var r,i={},o=null,l=null;t!==void 0&&(o=""+t),n.key!==void 0&&(o=""+n.key),n.ref!==void 0&&(l=n.ref);for(r in n)zm.call(n,r)&&!Fm.hasOwnProperty(r)&&(i[r]=n[r]);if(e&&e.defaultProps)for(r in n=e.defaultProps,n)i[r]===void 0&&(i[r]=n[r]);return{$$typeof:bm,type:e,key:o,ref:l,props:i,_owner:Mm.current}}var y=$p,T=$p;var Qp=(e)=>e?e.replace(/\\/g,""):"",oe=Wp.map((e)=>({title:Qp(e.title),html:Qp(e.html)})),Va=["Beginnings","Hosea","Joel","Amos","Obadiah","Jonah","Micah","Nahum","Habakkuk","Zephaniah","Haggai","Zechariah","Malachi"];function Ym(e){if(["Cover","Dedication","About This Book","Preface"].includes(e))return"Beginnings";let t=e.indexOf(" - ");if(t>-1)return e.slice(0,t).trim();return"Beginnings"}function Im(e){if(typeof document<"u"){let n=document.createElement("div");return n.innerHTML=e,(n.textContent||n.innerText||"").replace(/\s+/g," ").trim()}return e.replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim()}function $a(){let[e,n]=R.useState("sepia"),[t,r]=R.useState(18),[i,o]=R.useState(""),[l,a]=R.useState(!1),[s,c]=R.useState(!1),[m,g]=R.useState(0),[d,k]=R.useState(0),[E,H]=R.useState(!1),[M,p]=R.useState(0),[u,h]=R.useState(new Set),[w,C]=R.useState(new Set),[A,_]=R.useState(null),[L,B]=R.useState(""),[N,Ne]=R.useState([]),[Jr,ko]=R.useState(!1),[Qa,Xn]=R.useState(!1),[Zr,Ka]=R.useState(1),[Br,qp]=R.useState([]),[Wr,Xa]=R.useState(""),[qn,jp]=R.useState([]),[Rt,Lo]=R.useState(0),[qa,eh]=R.useState(!0),Vr=R.useRef(!1),Ge=R.useRef(null),So=R.useRef(null),nh=R.useRef(null),Nt=R.useMemo(()=>oe.map((f)=>Im(f.html)),[]),$r=R.useMemo(()=>{let f={};return Va.forEach((S)=>f[S]=[]),oe.forEach((S,D)=>{let G=Ym(S.title);if(!f[G])f[G]=[];f[G].push({id         }
        [data-theme="light"] {
          --bg: #FEFCF9;
          --bg-soft: #FFFEFB;

          --text-muted: #78716C;
          --text-faint: #A8A29E;
          --border: #F5F0E8;
          --border-strong: #E7DCC8;
          --accent: #B45309;
          --accent-soft: #FEF3C7;
          --card: #FFFFFF;
          --card-hover: #FFFBEB;
          --hl: #FEF3C7;
          --tts-bg: #FFFBEB;
          --paper: radial-gradient(ellipse at top, rgba(180,120,40,0.06), transparent 60%), radial-gradient(ellipse at bottom, rgba(180,120,40,0.04), transparent 70%);
        }
        [data-theme="sepia"] {
          --bg: #F6F1E7;
          --bg-soft: #FAF6EE;
          --text: #433422;
          --text-muted: #8B7355;
          --text-faint: #A89078;
          --border: #E8DDC8;
          --border-strong: #D6C4A3;
          --accent: #8B5A2B;
          --accent-soft: #F5E6CC;
          --card: #FDF8EF;
          --card-hover: #F5EAD0;
          --hl: #F5E6CC;
          --tts-bg: #F5E6CC;
          --paper: radial-gradient(ellipse at top, rgba(139,90,43,0.08), transparent 55%), radial-gradient(ellipse at 20% 80%, rgba(139,90,43,0.04), transparent 60%);
        }
        [data-theme="dark"] {

          --bg-soft: #18181B;
          --text: #E8E2DC;

          --text-faint: #71717A;
          --border: #27272A;
          --border-strong: #3F3F46;
          --accent: #F59E0B;
          --accent-soft: #422006;
          --card: #1C1C1F;
          --card-hover: #252529;
          --hl: #422006;
          --tts-bg: #292524;
          --paper: none;
        }
        html { scroll-behavior: smooth; }
        body { background: var(--bg); }
        .font-serif-body { font-family: 'Lora', Georgia, serif; }
        .font-display { font-family: 'Fraunces', Georgia, serif; }
        .font-ui { font-family: 'Inter', system-ui, sans-serif; }
        .prose-content {
          font-family: 'Lora', Georgia, serif;
          font-size: var(--base-font);
          line-height: 1.85;
          color: var(--text);
          max-width: 72ch;
        }
        .prose-content p {
          margin: 1.15em 0;
          hanging-punctuation: first;
        }
        .prose-content p:first-of-type::first-letter {
          font-family: 'Fraunces', serif;
          float: left;
          font-size: 3.1em;
          line-height: 0.82;
          padding-right: 0.12em;
          padding-top: 0.06em;
          font-weight: 700;
          color: var(--accent);
          font-variation-settings: 'WONK' 1;
        }
        .cover .prose-content p:first-of-type::first-letter { float: none; font-size: inherit; line-height: inherit; padding: 0; font-weight: inherit; color: inherit; }
        .prose-content .verse-ref {
          font-family: 'Fraunces', serif;
          font-style: italic;
          font-weight: 600;
          font-size: 0.86em;
          letter-spacing: 0.04em;
          text-transform: uppercase;
          color: var(--accent);
          border-left: 3px solid var(--border-strong);
          padding: 0.15em 0 0.15em 0.9em;
          margin: 2.2em 0 0.6em 0;
          display: block;
        }
        .prose-content .section-label {
          font-family: 'Inter', sans-serif;
          font-size: 0.72em;
          letter-spacing: 0.18em;
          text-transform: uppercase;
          font-weight: 600;
          color: var(--text-muted);
          margin: 2.4em 0 0.8em 0;
          display: flex;
          align-items: center;
          gap: 0.6em;
        }
        .prose-content .section-label::before {
          content: '';
          width: 22px;
          height: 1px;
          background: var(--border-strong);
          display: inline-block;
        }
        .prose-content .section-label.life::after { content: ' ✦'; font-size: 0.9em; opacity: 0.5; letter-spacing: 0; }
        .prose-content .section-label.prayer::after { content: ' \uD83D\uDE4F'; font-size: 0.9em; opacity: 0.6; letter-spacing: 0; }
        .prose-content h1, .prose-content h2, .prose-content h3 { font-family: 'Fraunces', serif; }
        .prose-content hr {
          border: none;
          height: 1px;
          background: linear-gradient(90deg, transparent, var(--border-strong), transparent);
          margin: 2.5em 0;
        }
        .search-hl {
          background: var(--hl);
          color: var(--text);
          padding: 0.1em 0.2em;
          border-radius: 3px;
          box-decoration-break: clone;
        }
        .tts-active {
          background: var(--tts-bg) !important;
          box-shadow: inset 3px 0 0 var(--accent);
          border-radius: 4px;
          padding-left: 0.6em !important;
          transition: background 0.3s ease;
        }
        .cover { text-align: center; padding: 3rem 1rem; }
        .cover .eyebrow { font-family: 'Inter', sans-serif; font-size: 0.75rem; letter-spacing: 0.28em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 2.2rem; }
        .cover h1 { font-family: 'Fraunces', serif; font-size: 1.35rem; line-height: 1.45; letter-spacing: 0.02em; color: var(--text); max-width: 30ch; margin: 0 auto 2rem; font-weight: 600; }
        .cover .subtitle { font-family: 'Lora', serif; font-style: italic; font-size: 1.05rem; color: var(--text-muted); margin-bottom: 3rem; line-height: 1.6; }
        .cover .author { font-family: 'Fraunces', serif; font-weight: 600; font-size: 1.1rem; margin-top: 1rem; }
        .cover .college { font-family: 'Inter', sans-serif; font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-faint); margin-top: 0.6rem; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
